name: Maven clean

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven clean test
        run: mvn -B clean test
